[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures-util = { version = "0.3", features = ["sink"] }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.24"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

rsmem = { path = "crates/rsmem" }
rsmodel = { path = "crates/rsmodel" }
rsoffsets = { path = "crates/rsoffsets" }
rs3events = { path = "crates/rs3events" }
rs3-eventd = { path = "crates/rs3-eventd" }
rsscan = { path = "crates/rsscan" }

# Scanning loops are hot; keep dev builds reasonably fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
